# Checks every push and pull request: types, lint, unit tests, database migrations + seed on a real
# PostgreSQL, concurrency tests on that PostgreSQL, a production build, and the end-to-end journeys
# (Playwright) on that build. Nothing is deployed from here.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck · lint · tests · migrations · build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coach_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throw-away values for CI only (no real secret here).
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/coach_crm
      DATABASE_POOL_MAX: "5"
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SITE_NOINDEX: "true"
      SEED_COACH_EMAIL: coach@ci.test
      SEED_COACH_PASSWORD: ci-password-0123
      FILES_DIR: ./.data/files
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx next typegen
          npm run typecheck

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Schema has a migration for every change
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/server/db/schema.ts changed without a migration: run 'npm run db:generate' and commit the files in drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Apply migrations on PostgreSQL
        run: npm run db:migrate

      - name: Seed (reference + demo data)
        run: npm run db:seed

      - name: Concurrency tests on PostgreSQL (seats, waiting list)
        run: npm run test:pg

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end journeys (Playwright, on the production build)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
